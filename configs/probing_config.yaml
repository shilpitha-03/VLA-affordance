depth_augmentation:
  cache_dir: /content/drive/MyDrive/VLA_Affordance_Project/VLA-affordance/results/cached_features/depth_normal
  dpt_model: Intel/dpt-large
  method: dpt
encoders:
  dino_wm:
    encoder_type: dinov2
    feature_dim: 768
    fused_feature_dim: 3072
    num_layers: 12
    num_patches: 256
    patch_size: 14
    probe_layers:
    - 2
    - 5
    - 8
    - 11
    repo: https://github.com/mazpie/dino-wm
    status: deferred
  dinov2:
    encoder_type: dinov2
    feature_dim: 768
    fused_feature_dim: 3072
    model_name: facebook/dinov2-base
    num_layers: 12
    num_patches: 256
    patch_size: 14
    probe_layers:
    - 2
    - 5
    - 8
    - 11
  paligemma_siglip:
    encoder_type: siglip
    feature_dim: 1152
    fused_feature_dim: 4608
    model_name: google/paligemma-3b-pt-224
    note: Requires HuggingFace gated access
    num_layers: 27
    num_patches: 256
    patch_size: 14
    probe_layers:
    - 6
    - 13
    - 20
    - 26
  pi05_siglip:
    encoder_type: siglip
    feature_dim: 1152
    fused_feature_dim: 4608
    num_layers: 27
    num_patches: 256
    patch_size: 14
    probe_layers:
    - 6
    - 13
    - 20
    - 26
    source: lerobot/pi05_base
  pi0_siglip:
    encoder_type: siglip
    feature_dim: 1152
    fused_feature_dim: 4608
    num_layers: 27
    num_patches: 256
    patch_size: 14
    probe_layers:
    - 6
    - 13
    - 20
    - 26
    source: lerobot/pi0_base
  raw_siglip:
    encoder_type: siglip
    feature_dim: 1152
    fused_feature_dim: 4608
    model_name: google/siglip-so400m-patch14-224
    num_layers: 27
    num_patches: 256
    patch_size: 14
    probe_layers:
    - 6
    - 13
    - 20
    - 26
image:
  patch_grid: 16
  resolution: 224
linear_probe:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  num_workers: 4
  optimizer: adamw
  warmup_fraction: 0.1
  weight_decay: 0.05
multilayer:
  cache_dtype: float16
  num_probes: 4
paths:
  cached_features: /content/drive/MyDrive/VLA_Affordance_Project/VLA-affordance/results/cached_features
  figures: /content/drive/MyDrive/VLA_Affordance_Project/VLA-affordance/results/figures
  models_dir: /content/drive/MyDrive/VLA_Affordance_Project/VLA-affordance/models
  tables: /content/drive/MyDrive/VLA_Affordance_Project/VLA-affordance/results/tables
  umd_dataset: /content/drive/MyDrive/VLA_Affordance_Project/VLA-affordance/data/umd
pca:
  n_components: 3
umd:
  categories:
  - background
  - grasp
  - cut
  - scoop
  - contain
  - pound
  - support
  - wrap-grasp
  num_classes: 8
